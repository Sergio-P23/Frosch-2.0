<div class="jugador" ng-class="{activo: jugador.activo}">
    <img class="avatar" ng-src="{{avatarJugador}}" alt="Jugador {{jugador.numero}}"/>
    <div class="datos" ng-class="{activo: jugador.activo}">
        <div class="identidad-jugador">
            <div class="titulo">{{ (jugador.equipo?"EQUIPO":"JUGADOR") | translate}} {{jugador.numero}}</div>
            <div class="blancos-jugador">BLANCOS <strong>{{jugador.blanqueadas}}</strong></div>
        </div>
        <div class="marcador-jugador" ng-class="{puntajeMedio: jugador.puntos >= 100 && jugador.puntos < 1000, puntajeLargo: jugador.puntos >= 1000}" aria-label="Puntaje {{jugador.puntos}}">
            <span>PUNTOS</span>
            <strong>{{jugador.puntos}}</strong>
        </div>
    </div>
</div>
